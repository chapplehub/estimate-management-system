# プロダクション用 Docker Compose（Issue #758）
#
# dev 用 compose.yaml とは独立したファイル（overlay にしない。
# dev 版と差分が大きく継承関係は事故のもと）。
#
# 環境変数は EC2 上に手動配置した .env ファイルから注入する（chmod 600・git 管理外）:
#   docker compose -f compose.prod.yaml --env-file .env.production up -d
# キー名の一覧は .env.production.example を参照。
#
# イメージは GHCR から pull したものだけを使う。ローカル検証では docker build で作った
# ローカルタグを APP_IMAGE / MIGRATE_IMAGE に指定する（docs/ops/prod-docker-local.md）。
#
# app / migrate が build: を持たないのは意図的（#761）。image: と build: を併記すると
# pull に失敗しても compose はエラー終了せず、EC2 上のチェックアウトからのビルドへ
# 暗黙にフォールバックする。CI がビルドしたものではないイメージが「デプロイ成功」として
# 動き、SHA タグ指定のロールバックも無言で失敗する。build: が無ければ pull 失敗は
# そのままエラーになる（EC2 上ビルドはイミュータブルデプロイと OOM リスクの観点から
# 不採用。#758）。
#
# pull_policy: always は採らない。pull 経路の強制は GHCR 障害時に「ローカルにイメージが
# あっても起動できない」という新しい障害モードを持ち込むため（再起動での復旧が効かなくなる）。
#
# up -d は既にローカルにあるタグを再 pull しない。新しいイメージを取り込むには
# 明示的な docker compose pull が要る。
#
# 公開ポートは nginx の 80/443 のみ。db / app はホストへ publish しない。

# プロジェクト名は dev 用（estimate-management-system）と別にし、
# ボリューム・ネットワークの衝突を防ぐ
name: estimate-management-system-prod

services:
  db:
    # dev 用 compose.yaml と同じ理由で OS サフィックスまでピン留めする
    # （無印タグはベース Debian の切替で glibc が黙って変わり、
    #   照合順序依存インデックスを壊しうる。更新は Renovate で意図的に取り込む）
    image: postgres:16.14-trixie
    restart: unless-stopped
    # ポートは publish しない（内部ネットワークからのみ到達可能）
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 で TCP 経由の到達性を見る。-h なしの pg_isready は Unix
      # ソケット判定になるが、postgres の entrypoint は initdb / 初期化スクリプトを
      # listen_addresses='' の一時サーバで走らせるため、TCP 5432 が閉じたまま
      # ソケットだけ応答する時間帯がある（空ボリューム起動の実測で
      # ソケット ready 1.33s に対し TCP ready 1.82s）。ここで healthy と誤判定すると
      # migrate が db:5432 に ECONNREFUSED で異常終了し、restart:"no" のため
      # 再試行されず app の service_completed_successfully が永久に満たされない
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      # EBS の遅い EC2 では初期化が数十秒に伸びうる。この間の失敗は
      # retries を消費しない
      start_period: 30s

  # マイグレーション one-shot サービス。db が healthy になってから実行され、
  # 正常終了すると app の起動条件（service_completed_successfully）が満たされる
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/chapplehub/estimate-management-system/migrate:latest}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  # 初期データ投入 one-shot サービス（ADR-20260821-4f1）。
  #
  # デプロイ先は公開デモ環境であり、初期データには開発 seed をそのまま流用する。
  # seed-dev.ts は全テーブルを deleteMany してから作り直す破壊的スクリプトのため、
  # profiles で up -d の対象から外し、明示的に呼んだときだけ走るようにする:
  #
  #   docker compose -f compose.prod.yaml --env-file .env.production stop app
  #   docker compose -f compose.prod.yaml --env-file .env.production --profile seed run --rm seed
  #   docker compose -f compose.prod.yaml --env-file .env.production start app
  #
  # image は migrate と同じものを共有する（新しいイメージ・タグ・*_IMAGE 変数を作らない）。
  # 変数名 MIGRATE_IMAGE と実態のずれは許容する。理由: このサービスのためだけに
  # SEED_IMAGE を増やすと、常に MIGRATE_IMAGE と同じ値を書く運用項目が増えるだけになる。
  #
  # depends_on は db のみ。migrate には依存させない。理由: 上記手順は up -d で
  # migrate が完了した後に実行する前提であり、依存させると compose run のたびに
  # migrate が起動して手順の意図（app を止めてから seed だけを叩く）がぼやけるため
  seed:
    image: ${MIGRATE_IMAGE:-ghcr.io/chapplehub/estimate-management-system/migrate:latest}
    command: ["node_modules/.bin/tsx", "prisma/seed-dev.ts"]
    profiles: ["seed"]
    restart: "no"
    # 他サービスと違いリスト形式。SEED_* は任意項目で、未設定なら
    # 「コンテナにも渡さない」（= seed 側の既定値を使う）挙動が要るため。
    # マップ形式 ${VAR} だと未設定時に空文字が渡り、既定値が効かなくなる
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SEED_DEFAULT_PASSWORD
      - SEED_TOTAL_EMPLOYEES
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-ghcr.io/chapplehub/estimate-management-system/app:latest}
    restart: unless-stopped
    # ポートは publish しない（公開は nginx の 80/443 のみ）
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # runner イメージ（node:slim）には curl/wget が無いため node の fetch で代替する
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    # メジャー/マイナーをピン留めし、更新は Renovate で意図的に取り込む
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    # 証明書の更新を反映するため 6h ごとに reload する（ADR-20260827-ff0）。
    # certbot サービスとは /etc/letsencrypt のファイル共有だけで繋がり、
    # deploy-hook や docker socket で互いを参照しない（疎結合）。
    # 周期 6h は原典 wmnnd/nginx-certbot どおり。reload は接続を切らないため
    # 周期を伸ばして得るものが無く、独自値は説明責任を恒常的に生むだけになる。
    #
    # command を上書きすると公式イメージの /docker-entrypoint.sh は
    # 「$1 = nginx」の条件を満たさず /docker-entrypoint.d/ を実行しない。
    # 現構成ではそこにある 4 本（IPv6 listen 自動付与・resolver 環境変数・
    # templates の envsubst・worker_processes autotune）はすべて no-op だが、
    # これらを使うようになったら本方式（command 上書き）を見直すこと。
    #
    # 末尾の exec は PID 1 を nginx に固定するため。busybox ash は末尾コマンドを
    # 暗黙に exec するが、実装依存に頼らず STOPSIGNAL SIGQUIT が nginx に
    # 直接届くことを明示する
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    # 外部公開はここ（80/443）のみ
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    # app の healthy は待たない（service_started）。リバースプロキシの可用性は
    # app の可用性の上位集合であるべきで、app が healthy にならない障害で
    # nginx ごと起動不能になると、ACME チャレンジ（webroot）への応答と 80 番の
    # 301 リダイレクトまで巻き添えで止まり、「nginx は生きているが app が死んでいる」
    # という切り分け情報も失われる。
    # app-ssl.conf は変数経由 proxy_pass + resolver 127.0.0.11 で upstream を
    # リクエスト時に解決するため、nginx の起動に app の DNS 名解決は不要。
    # 初回起動時に app ready まで 502 を返す窓が生じるが、接続拒否より望ましい
    # （TLS 終端が生き、ACME に応答でき、アクセスログに証跡が残る）。
    # depends_on 自体を消さないのは、起動ログが依存順に並ぶ実益を取るため
    depends_on:
      app:
        condition: service_started

  # 証明書の自動更新（ADR-20260827-ff0）。12h ごとに certbot renew を試み、
  # 更新された証明書は nginx 側の 6h ごとの reload で取り込まれる。
  # 反映まで最大 6h 遅れるが、certbot は失効 30 日前から更新するため問題にならない。
  # 初回発行は手動（docs/ops/tls-certificates.md）。ここでは renew しかしない。
  certbot:
    # 無印タグは amd64 / arm64 / arm32v6 のマルチアーチマニフェストのため
    # アーキ別タグは不要。更新は Renovate（docker-compose マネージャ）で取り込む
    image: certbot/certbot:v5.7.0
    # イメージの ENTRYPOINT が certbot そのものなので、ループを書くには
    # command ではなく entrypoint を上書きする必要がある。
    # trap exit TERM は docker stop で sleep を待たずに抜けるため
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    volumes:
      # ホスト bind mount を維持（nginx 側と対称。既存の証明書資産をそのまま引き継ぐ）。
      # renewal conf の webroot_path と一致させるため、webroot もホストと同じパスで
      # マウントする
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
      # イメージが VOLUME /var/lib/letsencrypt を宣言しているため、明示しないと
      # コンテナ再作成のたびに匿名ボリュームが増える。中身はロック等の作業用で
      # 引き継ぐ価値は無く、named volume にする目的は増殖防止のみ
      - certbot-work:/var/lib/letsencrypt
    # 初回 renew の webroot 応答を nginx が受けられるようにし、起動ログを依存順に
    # 並べるため。renew が失敗しても 12h 後に再試行されるので healthy は待たない
    depends_on:
      nginx:
        condition: service_started

volumes:
  pgdata:
  certbot-work:
