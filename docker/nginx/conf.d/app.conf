# リバースプロキシ設定（HTTP。Issue #758）
#
# ドメイン取得前のローカル検証・初期構築用。
# HTTPS（SSL 終端 + certbot）はドメイン取得後に app-ssl.conf.example を
# 有効化する（同ディレクトリの *.conf のみが読み込まれる）。

server {
    listen 80;
    server_name _;

    # certbot の HTTP-01 チャレンジ用（ドメイン取得後に有効化）
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # セキュリティヘッダー（docs/system-design-doc.md §11.3）
    # HSTS は HTTPS 有効化時に app-ssl.conf 側で付与する
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
