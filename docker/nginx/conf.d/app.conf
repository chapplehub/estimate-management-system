# HTTP（80 番）設定（Issue #758, #772）
#
# 役割は 2 つ:
#   1. certbot（webroot 方式）の ACME チャレンジ応答
#   2. それ以外の全リクエストを HTTPS へ 301 リダイレクト

server {
    listen 80;
    server_name chapple-esm.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
