# リバースプロキシ設定（HTTP。Issue #758）
#
# ドメイン取得前のローカル検証・初期構築用。
# HTTPS（SSL 終端 + certbot）はドメイン取得後に app-ssl.conf.example を
# 有効化する（同ディレクトリの *.conf のみが読み込まれる）。

server {
    listen 80;
    server_name _;

    # certbot の HTTP-01 チャレンジ用（ドメイン取得後に有効化）
    # location /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    # セキュリティヘッダー（docs/system-design-doc.md §11.3）
    # HSTS は HTTPS 有効化時に app-ssl.conf 側で付与する
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        # Docker 内蔵 DNS を明示し、変数経由で upstream を指定する。
        # リテラルホスト名の proxy_pass は設定ロード時に一度だけ名前解決され、
        # その IP をプロセス寿命の間キャッシュする。デプロイ（up -d）では app のみ
        # 再作成され nginx は再作成されないため、app の IP が変わると死んだ IP を
        # 叩き続けて自己回復しない。変数経由にすると解決がリクエスト時に遅延され、
        # valid=10s で再解決される（URI 部を持たない proxy_pass なので挙動は等価）
        #
        # 別解: nginx 1.27.3 以降の OSS では upstream ブロックの server ディレクティブが
        # resolve パラメータを使える（同ブロック内の zone と resolver が必須。1.28.0 で
        # nginx -t 通過を実測確認済み）。そちらは実行時に解決した結果を共有メモリに持つため
        # 負荷分散やバックエンドへの keepalive を併用できる。app を複数レプリカにする際は
        # 移行する。現状は単一コンテナでどちらの機能も使っておらず、location 内で完結する
        # この方式のほうが小さいため採らない（移行するとイメージの 1.27.3 以上が機能要件になる）
        resolver 127.0.0.11 valid=10s;
        set $upstream_app app;
        proxy_pass http://$upstream_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
